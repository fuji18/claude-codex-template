name: Claude Code Review

on:
  pull_request:
    # トークン最適化: レビューは main 向け PR のオープン時と ready_for_review 時の
    # 1 回のみ(feature → develop の PR では走らない)。push ごとの再レビュー
    # (synchronize)は行わない。再レビューが必要なときは PR 上で @claude に
    # メンションする(claude.yml が対応)。
    types: [opened, ready_for_review]
    branches:
      - main

# 連続でトリガーされた場合は古い実行をキャンセルする
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # draft PR はレビューしない(ready_for_review で走る)
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # テンプレートから作った新リポジトリではシークレット未設定のことがあるため、
      # 未設定時はレビューをスキップする(下の step の if を参照)
      CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        if: env.CLAUDE_TOKEN != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Notify review skipped
        if: env.CLAUDE_TOKEN == ''
        run: |
          echo "::warning title=Claude レビュー未実行::CLAUDE_CODE_OAUTH_TOKEN が未設定のため Claude Code Review は実行されていません。このジョブの success はレビュー通過を意味しません。"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ⚠️ Claude レビューは実行されていません

          `CLAUDE_CODE_OAUTH_TOKEN` が Actions シークレットに未設定のため、`Run Claude Code Review` は skip されました。

          **このジョブの `success` はレビュー通過を意味しません。**

          Settings → Secrets and variables → Actions で登録するまで、
          モード B(節約)の「draft で積んで枠の回復後にまとめてレビューする」は出口がありません
          (`docs/template-dev/codex-delegation-plan.md` §2.6)。
          EOF
